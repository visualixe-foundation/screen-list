<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen List — My Watchlist</title>
<meta name="description" content="Personal movie, series and animation watchlist">
<meta name="theme-color" content="#06070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="wrap">
<header>
<div class="logo">
<svg viewBox="0 0 40 40" fill="none"><rect x="2" y="6" width="36" height="28" rx="3" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="20" r="8" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="3" fill="currentColor"/><line x1="8" y1="6" x2="8" y2="34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/><line x1="32" y1="6" x2="32" y2="34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/></svg>
<h1>Screen <span>List</span></h1>
</div>
<p class="subtitle" id="subtitle">Pick a section to browse</p>
</header>

<div id="homeView">
<div class="section-list" id="sectionList"></div>
<div class="home-actions">
<button type="button" class="btn" id="browseAllBtn">Browse all titles</button>
<button type="button" class="btn" id="adminBtnHome">+ Add</button>
</div>
</div>

<div id="browseView" class="hidden">
<div class="controls-bar" id="controlsBar">
<div class="controls">
<button type="button" class="btn ghost back-btn" id="backHome" aria-label="Back to sections">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
Sections
</button>
<div class="search-wrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input id="q" type="search" placeholder="Search title or actor..." autocomplete="off">
<span class="kbd">/</span>
</div>
<select id="t">
<option value="">All sections</option>
<option value="Movie">Movies</option>
<option value="Series">Series</option>
<option value="Animation">Animation</option>
<option value="Marvel">Marvel</option>
<option value="DC">DC</option>
</select>
<select id="o">
<option value="year">By year</option>
<option value="section">By section</option>
<option value="az">A → Z</option>
<option value="new">Newest first</option>
<option value="old">Oldest first</option>
</select>
<button type="button" class="btn" id="adminBtn">+ Add</button>
</div>
<div class="chips" id="chips"></div>
</div>

<div class="stats" id="stats"></div>
<div id="count"></div>
<div id="g"></div>
</div>

<footer><a href="https://visualixe-foundation.vercel.app/" target="_blank" rel="noopener">Visualixe Foundation</a></footer>
</div>

<div class="modal-overlay" id="adminModal">
<div class="modal">
<div id="pinGate" class="pin-gate">
<h2>Admin</h2>
<p class="hint">Enter PIN to add movies (stored only on this device)</p>
<input type="password" id="pinInput" placeholder="PIN" maxlength="12" autocomplete="off">
<div class="form-actions">
<button type="button" class="btn primary" id="pinSubmit">Unlock</button>
<button type="button" class="btn ghost" id="pinCancel">Cancel</button>
</div>
<p class="admin-msg" id="pinMsg"></p>
</div>
<div id="adminForm" style="display:none">
<h2>Add title</h2>
<p class="hint">Saved in this browser. Export JSON from the admin form and paste into movies.js to make permanent.</p>
<div class="form-row"><label>Title *</label><input id="fTitle" type="text" placeholder="Movie or series name"></div>
<div class="form-row"><label>Year</label><input id="fYear" type="text" placeholder="2024"></div>
<div class="form-row"><label>Type</label><select id="fType"><option value="Movie">Movie</option><option value="Series">Series</option><option value="Animation">Animation</option></select></div>
<div class="form-row"><label>Cast (comma-separated)</label><input id="fCast" type="text" placeholder="Actor One, Actor Two"></div>
<div class="form-row"><label>Poster URL (optional)</label><input id="fPoster" type="url" placeholder="https://..."></div>
<div class="form-row"><label>Tags</label><input id="fTags" type="text" placeholder="Marvel, DC (optional)"></div>
<div class="form-actions">
<button type="button" class="btn primary" id="fSave">Save</button>
<button type="button" class="btn" id="fExport">Export JSON</button>
<button type="button" class="btn ghost" id="fClose">Close</button>
</div>
<div class="form-row"><label>OMDb API key (loads posters)</label><input id="fOmdb" type="text" placeholder="Paste your OMDb key once"></div>
<div class="form-row" style="margin-top:12px"><label>Change PIN</label><input id="fNewPin" type="password" placeholder="New PIN (optional)"></div>
<p class="admin-msg" id="adminMsg"></p>
</div>
</div>
</div>

<script src="posters.js"></script>
<script src="poster-loader.js"></script>
<script src="movies.js"></script>
<script src="movies-extra.js"></script>
<script src="app.js"></script>
</body>
</html>
