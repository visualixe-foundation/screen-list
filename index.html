<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen List — My Watchlist</title>
<meta name="description" content="Personal movie and series watchlist">
<meta name="theme-color" content="#06070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070d;--bg-card:#0f1222;--bg-elevated:#161a2e;--tx:#eceef4;--mu:#8b92a8;--ac:#c4943a;--ac-soft:rgba(196,148,58,.15);--border:#1e2438;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.45}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(196,148,58,.08),transparent),radial-gradient(ellipse 60% 40% at 90% 10%,rgba(100,80,180,.06),transparent);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 18px 48px}
header{padding:36px 0 12px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
.logo svg{width:36px;height:36px;color:var(--ac)}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.8rem,4vw,2.4rem);letter-spacing:-.02em}
h1 span{color:var(--ac)}
.subtitle{color:var(--mu);font-size:.95rem;margin-top:4px}
.controls-bar{position:sticky;top:0;z-index:20;background:rgba(6,7,13,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 0 8px;margin:0 -18px;padding-left:18px;padding-right:18px;border-bottom:1px solid transparent}
.controls-bar.scrolled{border-bottom-color:var(--border)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search-wrap .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--mu);border:1px solid var(--border);border-radius:5px;padding:2px 6px;pointer-events:none;opacity:.7}
input,select,button{background:var(--bg-card);color:var(--tx);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ac)}
.search-wrap input{width:100%;padding-left:40px;padding-right:36px}
select{cursor:pointer;min-width:120px}
.btn{cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#0a0b10}
.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.chip{background:var(--bg-card);border:1px solid var(--border);color:var(--mu);border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:500;cursor:pointer;user-select:none;min-height:36px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--ac);color:var(--tx)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#0a0b10}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;padding:14px 16px;margin:8px 0 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
.stat{text-align:center;min-width:70px}
.stat-num{display:block;font-size:1.25rem;font-weight:700;color:var(--ac);line-height:1.2}
.stat-label{font-size:.7rem;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
#count{color:var(--mu);font-size:.85rem;margin-bottom:12px}
.year-group{margin-bottom:16px}
.year-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;user-select:none;padding:2px 0}
.year-header:hover .year-label{color:var(--ac)}
.year-label{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700}
.year-line{flex:1;height:1px;background:var(--border)}
.year-count{color:var(--mu);font-size:.8rem;white-space:nowrap}
.year-chevron{color:var(--mu);transition:transform .2s;flex-shrink:0}
.year-group.collapsed .year-chevron{transform:rotate(-90deg)}
.year-group.collapsed .movie-grid{display:none}
.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);border-color:rgba(196,148,58,.35);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--bg-elevated);display:block}
.poster-ph{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#12162a,#0a0c16);color:var(--ac);font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;letter-spacing:.02em;user-select:none}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:.98rem;font-weight:600;line-height:1.3}
.meta{color:var(--mu);font-size:.8rem}
.meta .year{color:var(--ac);font-weight:500}
.cast{color:var(--mu);font-size:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:.65rem;font-weight:500;background:var(--bg-elevated);border-radius:6px;padding:2px 7px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
.tag.series{background:var(--ac-soft);color:var(--ac)}
.tag.local{background:rgba(100,160,255,.15);color:#7eb0ff}
.empty{text-align:center;padding:56px 24px;color:var(--mu)}
.empty-icon{width:56px;height:56px;margin:0 auto 16px;color:var(--border)}
.empty h3{color:var(--tx);font-size:1.15rem;font-weight:600;margin-bottom:6px}
.empty p{font-size:.9rem;max-width:280px;margin:0 auto 16px}
footer{text-align:center;padding:28px 0 12px;color:var(--mu);font-size:.8rem}
footer a{color:var(--ac);text-decoration:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;padding:24px}
.modal h2{font-family:'Playfair Display',serif;font-size:1.4rem;margin-bottom:4px}
.modal .hint{color:var(--mu);font-size:.8rem;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:.75rem;color:var(--mu);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.form-row input,.form-row select{width:100%}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.form-actions .btn{flex:1;min-width:100px;text-align:center}
.admin-msg{font-size:.8rem;margin-top:10px;min-height:1.2em}
.admin-msg.ok{color:#6dcc8a}
.admin-msg.err{color:#e06848}
.pin-gate{text-align:center}
.pin-gate input{text-align:center;letter-spacing:.3em;font-size:1.2rem;max-width:160px;margin:12px auto;display:block}
@media(max-width:520px){
.controls{flex-direction:column;align-items:stretch}
select,.btn{width:100%}
.search-wrap .kbd{display:none}
.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;padding-bottom:4px;margin:8px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;font-size:.8rem;min-height:34px;flex-shrink:0}
.year-label{font-size:1.1rem}
.year-count{font-size:.75rem}
.stats{gap:10px 12px;padding:12px}
.stat-num{font-size:1.1rem}
.movie-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card-body{padding:10px}
.card h3{font-size:.9rem}
}
@media(min-width:400px) and (max-width:700px){
.movie-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">
<svg viewBox="0 0 40 40" fill="none"><rect x="2" y="6" width="36" height="28" rx="3" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="20" r="8" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="3" fill="currentColor"/><line x1="8" y1="6" x2="8" y2="34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/><line x1="32" y1="6" x2="32" y2="34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/></svg>
<h1>Screen <span>List</span></h1>
</div>
<p class="subtitle">Movies & series worth watching</p>
</header>

<div class="controls-bar" id="controlsBar">
<div class="controls">
<div class="search-wrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input id="q" type="search" placeholder="Search title or actor..." autocomplete="off">
<span class="kbd">/</span>
</div>
<select id="t"><option value="">All types</option><option value="Movie">Movie</option><option value="Series">Series</option></select>
<select id="o"><option value="year">By year</option><option value="az">A → Z</option><option value="new">Newest first</option><option value="old">Oldest first</option></select>
<button type="button" class="btn" id="adminBtn">+ Add</button>
</div>
<div class="chips" id="chips"></div>
</div>

<div class="stats" id="stats"></div>
<div id="count"></div>
<div id="g"></div>

<footer><a href="https://visualixe-foundation.vercel.app/" target="_blank" rel="noopener">Visualixe Foundation</a></footer>
</div>

<div class="modal-overlay" id="adminModal">
<div class="modal">
<div id="pinGate" class="pin-gate">
<h2>Admin</h2>
<p class="hint">Enter PIN to add movies (stored only on this device)</p>
<input type="password" id="pinInput" placeholder="PIN" maxlength="12" autocomplete="off">
<div class="form-actions">
<button type="button" class="btn primary" id="pinSubmit">Unlock</button>
<button type="button" class="btn ghost" id="pinCancel">Cancel</button>
</div>
<p class="admin-msg" id="pinMsg"></p>
</div>
<div id="adminForm" style="display:none">
<h2>Add title</h2>
<p class="hint">Saved in this browser. Export JSON to put into movies.js permanently.</p>
<div class="form-row"><label>Title *</label><input id="fTitle" type="text" placeholder="Movie or series name"></div>
<div class="form-row"><label>Year</label><input id="fYear" type="text" placeholder="2024"></div>
<div class="form-row"><label>Type</label><select id="fType"><option value="Movie">Movie</option><option value="Series">Series</option></select></div>
<div class="form-row"><label>Cast (comma-separated)</label><input id="fCast" type="text" placeholder="Actor One, Actor Two"></div>
<div class="form-row"><label>Poster URL (optional)</label><input id="fPoster" type="url" placeholder="https://..."></div>
<div class="form-row"><label>Tags</label><input id="fTags" type="text" placeholder="Animation"></div>
<div class="form-actions">
<button type="button" class="btn primary" id="fSave">Save</button>
<button type="button" class="btn" id="fExport">Export JSON</button>
<button type="button" class="btn ghost" id="fClose">Close</button>
</div>
<div class="form-row"><label>OMDb API key (loads posters)</label><input id="fOmdb" type="text" placeholder="Paste your OMDb key once"></div>
<div class="form-row" style="margin-top:12px"><label>Change PIN</label><input id="fNewPin" type="password" placeholder="New PIN (optional)"></div>
<p class="admin-msg" id="adminMsg"></p>
</div>
</div>
</div>

<script src="poster-loader.js"></script>
<script src="movies.js"></script>
<script>
const LS_EXTRA='screenlist_extra',LS_PIN='screenlist_pin',DEFAULT_PIN='1234';
let actor='',allMovies=[];
const $=id=>document.getElementById(id);
function loadExtras(){try{return JSON.parse(localStorage.getItem(LS_EXTRA)||'[]')}catch(e){return[]}}
function saveExtras(list){localStorage.setItem(LS_EXTRA,JSON.stringify(list))}
function getPin(){return localStorage.getItem(LS_PIN)||DEFAULT_PIN}
function mergeMovies(){
  const extras=loadExtras().map(m=>({...m,_local:true}));
  const keys=new Set(MOVIES.map(m=>(m.title+'|'+(m.year||'')).toLowerCase()));
  allMovies=[...MOVIES,...extras.filter(m=>!keys.has((m.title+'|'+(m.year||'')).toLowerCase()))];
}
function yearKey(m){
  if(!m.year)return 'Unknown';
  const n=parseInt(String(m.year).slice(0,4),10);
  return isNaN(n)?'Unknown':String(n);
}
function readUrlParams(){
  const p=new URLSearchParams(location.search);
  if(p.has('q')) $('q').value=p.get('q')||'';
  if(p.has('type')) $('t').value=p.get('type')||'';
  if(p.has('sort')){const s=p.get('sort');if(['year','az','new','old'].includes(s)) $('o').value=s;}
  if(p.has('actor')) actor=p.get('actor')||'';
}
function writeUrlParams(){
  const p=new URLSearchParams();
  const q=$('q').value.trim();const t=$('t').value;const o=$('o').value;
  if(q) p.set('q',q);if(t) p.set('type',t);if(o&&o!=='year') p.set('sort',o);if(actor) p.set('actor',actor);
  const qs=p.toString();const url=qs?(location.pathname+'?'+qs):location.pathname;
  if(url!==location.pathname+location.search) history.replaceState(null,'',url);
}
function updateStats(){
  const movies=allMovies.filter(m=>m.type==='Movie').length;
  const series=allMovies.filter(m=>m.type==='Series').length;
  const actorCounts={};
  allMovies.forEach(m=>(m.cast||[]).forEach(a=>{actorCounts[a]=(actorCounts[a]||0)+1}));
  const top=Object.entries(actorCounts).sort((a,b)=>b[1]-a[1])[0];
  const years=allMovies.map(yearKey).filter(y=>y!=='Unknown').map(Number).filter(n=>!isNaN(n));
  const yMin=years.length?Math.min(...years):'\u2014';
  const yMax=years.length?Math.max(...years):'\u2014';
  const range=yMin===yMax?yMin:(yMin+'\u2013'+yMax);
  const topName=top?top[0].split(' ')[0]:'\u2014';
  const topLabel=top?('Top: '+top[0]):'Top actor';
  $('stats').innerHTML=
    '<div class="stat"><span class="stat-num">'+allMovies.length+'</span><span class="stat-label">Titles</span></div>'+
    '<div class="stat"><span class="stat-num">'+movies+'</span><span class="stat-label">Movies</span></div>'+
    '<div class="stat"><span class="stat-num">'+series+'</span><span class="stat-label">Series</span></div>'+
    '<div class="stat"><span class="stat-num">'+topName+'</span><span class="stat-label">'+topLabel+'</span></div>'+
    '<div class="stat"><span class="stat-num">'+range+'</span><span class="stat-label">Years</span></div>';
}
function buildChips(){
  const counts={};
  allMovies.forEach(m=>(m.cast||[]).forEach(a=>{counts[a]=(counts[a]||0)+1}));
  return Object.entries(counts).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
function renderChips(){
  const topActors=buildChips();
  $('chips').innerHTML=['All',...topActors].map(a=>
    '<span class="chip '+((a==='All'?actor==='':a===actor)?'on':'')+'" data-a="'+a+'">'+a+'</span>'
  ).join('');
  document.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{actor=c.dataset.a==='All'?'':c.dataset.a;renderChips();render()}
  });
}
function escapeHtml(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"')}
function posterBlock(m){
  if(m.poster){
    return '<img class="poster" src="'+escapeHtml(m.poster)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="poster-ph" style="display:none">'+(m.title?escapeHtml(m.title.charAt(0)):'?')+'</div>';
  }
  const letter=m.title?escapeHtml(m.title.charAt(0).toUpperCase()):'?';
  return '<div class="poster-ph">'+letter+'</div>';
}
function cardHTML(m){
  const year=m.year?'<span class="year">'+m.year+'</span>':'Year unknown';
  const cast=(m.cast&&m.cast.length)?'<div class="cast">'+m.cast.join(', ')+'</div>':'';
  const typeTag=m.type==='Series'?'<span class="tag series">Series</span>':'';
  const localTag=m._local?'<span class="tag local">Local</span>':'';
  const extraTags=(m.tags||[]).map(x=>'<span class="tag">'+x+'</span>').join('');
  return '<article class="card">'+posterBlock(m)+'<div class="card-body"><h3>'+escapeHtml(m.title)+'</h3><div class="meta">'+year+'</div>'+cast+'<div class="tags">'+typeTag+localTag+extraTags+'</div></div></article>';
}
function render(){
  const q=$('q').value.toLowerCase().trim(),t=$('t').value,o=$('o').value;
  let list=allMovies.filter(m=>{
    if(t&&m.type!==t)return false;
    if(actor&&!(m.cast||[]).includes(actor))return false;
    if(q){const hay=(m.title+' '+(m.cast||[]).join(' ')).toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  if(o==='az')list.sort((a,b)=>a.title.localeCompare(b.title));
  else if(o==='new')list.sort((a,b)=>(parseInt(b.year)||0)-(parseInt(a.year)||0));
  else if(o==='old')list.sort((a,b)=>(parseInt(a.year)||9999)-(parseInt(b.year)||9999));
  $('count').textContent=list.length+' of '+allMovies.length+' titles';
  writeUrlParams();
  if(!list.length){
    $('g').innerHTML='<div class="empty"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg><h3>No matches</h3><p>Nothing fits that search or filter. Try another actor or clear filters.</p><button type="button" class="btn" id="emptyClear">Clear filters</button></div>';
    const btn=$('emptyClear');if(btn)btn.onclick=()=>{$('q').value='';$('t').value='';actor='';renderChips();render()};
    return;
  }
  if(o==='year'){
    const groups={};
    list.forEach(m=>{const y=yearKey(m);if(!groups[y])groups[y]=[];groups[y].push(m)});
    const years=Object.keys(groups).sort((a,b)=>{if(a==='Unknown')return 1;if(b==='Unknown')return -1;return Number(b)-Number(a)});
    $('g').innerHTML=years.map(y=>{
      const films=groups[y];films.sort((a,b)=>a.title.localeCompare(b.title));
      return '<div class="year-group"><div class="year-header"><span class="year-label">'+y+'</span><div class="year-line"></div><span class="year-count">'+films.length+' title'+(films.length!==1?'s':'')+'</span><svg class="year-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div><div class="movie-grid">'+films.map(cardHTML).join('')+'</div></div>';
    }).join('');
    document.querySelectorAll('.year-header').forEach(h=>{h.onclick=()=>h.closest('.year-group').classList.toggle('collapsed')});
  } else {
    $('g').innerHTML='<div class="movie-grid">'+list.map(cardHTML).join('')+'</div>';
  }
}
window.addEventListener('scroll',()=>{$('controlsBar').classList.toggle('scrolled',window.scrollY>40)},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='/' && !e.ctrlKey && !e.metaKey && !e.altKey){
    const tag=(e.target&&e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable) return;
    e.preventDefault();
    $('q').focus();
    $('q').select();
  }
});
function openAdmin(){$('adminModal').classList.add('open');$('pinGate').style.display='block';$('adminForm').style.display='none';$('pinInput').value='';$('pinMsg').textContent='';setTimeout(()=>$('pinInput').focus(),50)}
function closeAdmin(){$('adminModal').classList.remove('open')}
function unlockAdmin(){if($('pinInput').value!==getPin()){$('pinMsg').textContent='Wrong PIN';$('pinMsg').className='admin-msg err';return}$('pinGate').style.display='none';$('adminForm').style.display='block';$('adminMsg').textContent='';$('fTitle').focus()}
function saveMovie(){
  const title=$('fTitle').value.trim();
  if(!title){$('adminMsg').textContent='Title is required';$('adminMsg').className='admin-msg err';return}
  const entry={title,year:$('fYear').value.trim(),type:$('fType').value,cast:$('fCast').value.split(',').map(s=>s.trim()).filter(Boolean),tags:$('fTags').value.split(',').map(s=>s.trim()).filter(Boolean)};
  const poster=$('fPoster').value.trim();if(poster) entry.poster=poster;
  const extras=loadExtras();extras.push(entry);saveExtras(extras);
  const newPin=$('fNewPin').value.trim();if(newPin)localStorage.setItem(LS_PIN,newPin);
  const omdbKey=$('fOmdb')&&$('fOmdb').value.trim();if(omdbKey&&typeof setOmdbKey==='function'){setOmdbKey(omdbKey);fetchPostersFromOmdb(allMovies,function(){render();});$('adminMsg').textContent='Loading posters…';$('adminMsg').className='admin-msg ok';}
  if(!omdbKey){$('adminMsg').textContent='Saved locally';$('adminMsg').className='admin-msg ok';}
  $('fTitle').value='';$('fYear').value='';$('fCast').value='';$('fTags').value='';$('fPoster').value='';$('fNewPin').value='';
  mergeMovies();if(typeof applyPosterCache==='function')applyPosterCache(allMovies);updateStats();renderChips();render();
}
function exportJSON(){
  const extras=loadExtras();
  if(!extras.length){$('adminMsg').textContent='No local titles yet';$('adminMsg').className='admin-msg err';return}
  const text=extras.map(m=>JSON.stringify(m,null,2)).join(',\n');
  navigator.clipboard.writeText(text).then(()=>{$('adminMsg').textContent='Copied — paste into movies.js';$('adminMsg').className='admin-msg ok'}).catch(()=>{console.log(text);$('adminMsg').textContent='See console';$('adminMsg').className='admin-msg err'});
}
$('adminBtn').onclick=openAdmin;$('pinCancel').onclick=closeAdmin;$('pinSubmit').onclick=unlockAdmin;
$('pinInput').onkeydown=e=>{if(e.key==='Enter')unlockAdmin()};
$('fClose').onclick=closeAdmin;$('fSave').onclick=saveMovie;$('fExport').onclick=exportJSON;
$('adminModal').addEventListener('click',e=>{if(e.target===$('adminModal'))closeAdmin()});
['q','t','o'].forEach(id=>$(id).addEventListener('input',render));
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});
}
mergeMovies();
if(typeof applyPosterCache==='function')applyPosterCache(allMovies);
readUrlParams();
updateStats();
renderChips();
render();
if(typeof fetchPostersFromOmdb==='function'){fetchPostersFromOmdb(allMovies,function(){render();});}
</script>
</body>
</html>
