<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen List — My Watchlist</title>
  <meta name="description" content="Personal movie & series watchlist — title, year, and cast.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06070d;
      --bg-card: #0f1222;
      --bg-elevated: #161a2e;
      --tx: #eceef4;
      --mu: #8b92a8;
      --ac: #c4943a;
      --ac-soft: rgba(196, 148, 58, 0.15);
      --border: #1e2438;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      line-height: 1.45;
    }
    /* subtle ambient glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(196, 148, 58, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(100, 80, 180, 0.06), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 18px 48px; }

    /* Header */
    header {
      padding: 40px 0 20px;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .logo svg { width: 36px; height: 36px; color: var(--ac); }
    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--ac); }
    .subtitle {
      color: var(--mu);
      font-size: 0.95rem;
      font-weight: 400;
      margin-top: 4px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 28px 0 12px;
      align-items: center;
    }
    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      pointer-events: none;
    }
    input, select {
      background: var(--bg-card);
      color: var(--tx);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--ac); }
    .search-wrap input {
      width: 100%;
      padding-left: 40px;
    }
    select { cursor: pointer; min-width: 130px; }

    /* Actor chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--mu);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .chip:hover { border-color: var(--ac); color: var(--tx); }
    .chip.on {
      background: var(--ac);
      border-color: var(--ac);
      color: #0a0b10;
    }

    /* Count */
    #count {
      color: var(--mu);
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(196, 148, 58, 0.35);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    .card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .meta {
      color: var(--mu);
      font-size: 0.85rem;
    }
    .meta .year { color: var(--ac); font-weight: 500; }
    .cast {
      color: var(--mu);
      font-size: 0.8rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tag {
      font-size: 0.7rem;
      font-weight: 500;
      background: var(--bg-elevated);
      border-radius: 6px;
      padding: 3px 8px;
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .tag.series {
      background: var(--ac-soft);
      color: var(--ac);
    }

    /* Empty */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--mu);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 32px 0 16px;
      color: var(--mu);
      font-size: 0.8rem;
    }
    footer a { color: var(--ac); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      .controls { flex-direction: column; align-items: stretch; }
      select { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="2" y="6" width="36" height="28" rx="3" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="20" cy="20" r="8" stroke="currentColor" stroke-width="2"/>
          <circle cx="20" cy="20" r="3" fill="currentColor"/>
          <line x1="8" y1="6" x2="8" y2="34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>
          <line x1="32" y1="6" x2="32" y2="34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>
        </svg>
        <h1>Screen <span>List</span></h1>
      </div>
      <p class="subtitle">Movies & series worth watching</p>
    </header>

    <div class="controls">
      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="search" placeholder="Search title or actor..." autocomplete="off">
      </div>
      <select id="t">
        <option value="">All types</option>
        <option value="Movie">Movie</option>
        <option value="Series">Series</option>
      </select>
      <select id="o">
        <option value="az">A → Z</option>
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
      </select>
    </div>

    <div class="chips" id="chips"></div>
    <div id="count"></div>
    <div class="grid" id="g"></div>

    <footer>
      Personal watchlist · Data lives in <code>movies.js</code> · <a href="https://github.com/visualixefoundation/screen-list" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script src="movies.js"></script>
  <script>
    let actor = "";
    const $ = id => document.getElementById(id);

    // Build actor frequency for chips (appear ≥ 2 times)
    const counts = {};
    MOVIES.forEach(m => (m.cast || []).forEach(a => { counts[a] = (counts[a] || 0) + 1; }));
    const topActors = Object.entries(counts)
      .filter(([, n]) => n >= 2)
      .sort((a, b) => b[1] - a[1])
      .map(([name]) => name);

    function renderChips() {
      $("chips").innerHTML = ["All", ...topActors].map(a =>
        `<span class="chip ${(a === "All" ? actor === "" : a === actor) ? "on" : ""}" data-a="${a}">${a}</span>`
      ).join("");
      document.querySelectorAll(".chip").forEach(c => {
        c.onclick = () => {
          actor = c.dataset.a === "All" ? "" : c.dataset.a;
          renderChips();
          render();
        };
      });
    }

    function render() {
      const q = $("q").value.toLowerCase().trim();
      const t = $("t").value;
      const o = $("o").value;

      let list = MOVIES.filter(m => {
        if (t && m.type !== t) return false;
        if (actor && !(m.cast || []).includes(actor)) return false;
        if (q) {
          const hay = (m.title + " " + (m.cast || []).join(" ")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (o === "az") return a.title.localeCompare(b.title);
        if (o === "new") return (parseInt(b.year) || 0) - (parseInt(a.year) || 0);
        return (parseInt(a.year) || 9999) - (parseInt(b.year) || 9999);
      });

      $("count").textContent = list.length + " of " + MOVIES.length + " titles";

      if (list.length === 0) {
        $("g").innerHTML = `<div class="empty">No titles match your search or filters.</div>`;
        return;
      }

      $("g").innerHTML = list.map(m => {
        const year = m.year ? `<span class="year">${m.year}</span>` : "Year unknown";
        const cast = (m.cast && m.cast.length) ? `<div class="cast">${m.cast.join(", ")}</div>` : "";
        const typeTag = m.type === "Series" ? `<span class="tag series">Series</span>` : "";
        const extraTags = (m.tags || []).map(x => `<span class="tag">${x}</span>`).join("");
        return `<article class="card">
          <h3>${m.title}</h3>
          <div class="meta">${year}</div>
          ${cast}
          <div class="tags">${typeTag}${extraTags}</div>
        </article>`;
      }).join("");
    }

    ["q", "t", "o"].forEach(id => $(id).addEventListener("input", render));
    renderChips();
    render();
  </script>
</body>
</html>
